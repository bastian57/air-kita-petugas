name: Build APK (Petugas)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "sdk.dir=$SDK" > local.properties
          CT=$(ls -d $SDK/cmdline-tools/* 2>/dev/null | head -1)
          export PATH=$CT/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: air-kita-petugas-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Rolling release (latest)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: app/build/outputs/apk/debug/app-debug.apk
          asset_name: app-debug.apk
          tag: latest
          overwrite: true
          release_name: "AIR KITA Petugas (latest)"
          body: "APK pencatat meter lapangan PAMSIMAS — offline, sync via QR."
