name: Build APK (Petugas)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "sdk.dir=$SDK" > local.properties
          CT=$(ls -d $SDK/cmdline-tools/* 2>/dev/null | head -1)
          export PATH=$CT/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Decode keystore (dari secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > $HOME/release.p12
            echo "Keystore decoded."
          else
            echo "Secret KEYSTORE_BASE64 kosong."
          fi

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ env.HOME }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: air-kita-petugas-release
          path: app/build/outputs/apk/release/*.apk

      - name: Rolling release (latest)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: app/build/outputs/apk/release/app-release.apk
          asset_name: app-release.apk
          tag: latest
          overwrite: true
          release_name: "AIR KITA Petugas (latest)"
          body: "APK release pencatat meter lapangan PAMSIMAS — signed, R8 minified, offline sync via QR."
